[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twindyn"
version = "1.0.0"
description = "Label-free microenvironment digital twin for ccRCC survival prognosis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "black>=24.4",
    "isort>=5.13",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
twindyn-train = "twindyn.cli.train:main"
twindyn-evaluate = "twindyn.cli.evaluate:main"
twindyn-prepare-data = "twindyn.cli.prepare_data:main"
twindyn-ablation = "twindyn.cli.ablation:main"
twindyn-verify = "twindyn.cli.verify:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH"]
ignore = ["N806", "N803", "RUF012", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
# The comparator family shares one fit signature so every row is interchangeable under the protocol.
"src/twindyn/models/baselines/*" = ["ARG001", "ARG002"]
# The static control mirrors the selective scan's forward interface so the two are interchangeable.
"src/twindyn/models/static_transition.py" = ["ARG002"]
# The check registry calls every entry with the same context argument, and the claim and
# deviation records are held one per line.
"src/twindyn/verification.py" = ["ARG001", "E501"]
"src/twindyn/claims.py" = ["E501"]
"src/twindyn/reported.py" = ["E501"]
"src/twindyn/evaluation/reporting.py" = ["E501"]
"src/twindyn/data/loaders/tcia.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["twindyn"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["build", "dist"]

# The algorithm modules (data, models, losses, metrics, training, evaluation views and
# selection, utils) and the resource readers type-check without overrides. The modules
# below build and read the report payloads as nested plain mappings, and the annotation
# work outstanding there is the payload plumbing rather than the science, so the bar is
# relaxed for them and stated in README.md under Tooling.
[[tool.mypy.overrides]]
module = [
    "twindyn.pipeline",
    "twindyn.verification",
    "twindyn.claims",
    "twindyn.cli.*",
    "twindyn.evaluation.reporting",
    "twindyn.evaluation.external",
    "twindyn.evaluation.mechanism",
    "twindyn.evaluation.sweeps",
    "twindyn.data.dataset",
    "twindyn.models.baselines.tree",
]
ignore_errors = true

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["twindyn"]
